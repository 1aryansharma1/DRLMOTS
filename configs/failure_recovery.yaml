outages:
  - {node_id: 'fog:fog-a', start_ms: 10, end_ms: 28}
  - {node_id: 'fog:fog-b', start_ms: 20, end_ms: 38}
  - {node_id: 'cloud:cloud', start_ms: 65, end_ms: 85}
  - {node_id: 'fog:fog-a', start_ms: 90, end_ms: 105}
  - {node_id: 'fog:fog-b', start_ms: 110, end_ms: 130}
