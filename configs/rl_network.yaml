# Multiple eligible VMs give both DQN variants actual within-tier placement choices.
schema_version: 3
kind: synthetic_baseline
resource_units: {cpu_units: abstract CPU units, memory_gb: GB}
topology:
  hosts:
    - {host_id: hf-a, storage_tb: 3, memory_gb: 32, bandwidth_reported: 1000}
    - {host_id: hf-b, storage_tb: 3, memory_gb: 32, bandwidth_reported: 1000}
    - {host_id: hc, storage_tb: 3, memory_gb: 32, bandwidth_reported: 1000}
  vms:
    - {vm_id: cloud-1, tier: cloud, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 4, memory_gb: 8}}
    - {vm_id: cloud-2, tier: cloud, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 4, memory_gb: 8}}
    - {vm_id: fog-a1, tier: fog, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 2, memory_gb: 4}}
    - {vm_id: fog-a2, tier: fog, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 2, memory_gb: 4}}
    - {vm_id: fog-b1, tier: fog, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 2, memory_gb: 4}}
    - {vm_id: fog-b2, tier: fog, bandwidth_reported: 200, queue_capacity: 2, resource_capacities: {cpu_units: 2, memory_gb: 4}}
  fog_nodes:
    - {fog_node_id: fog-a, host_ids: [hf-a], vm_ids: [fog-a1, fog-a2]}
    - {fog_node_id: fog-b, host_ids: [hf-b], vm_ids: [fog-b1, fog-b2]}
  cloud_datacenters:
    - {datacenter_id: cloud, host_ids: [hc], vm_ids: [cloud-1, cloud-2]}
  access_points:
    - {access_point_id: ap, end_node_id: end}
  end_nodes:
    - {end_node_id: end, fog_node_ids: [fog-a, fog-b]}
placement:
  policy: fog_first_completion
  source_end_node_id: end
  data_size_unit: decimal_kB
  upload_model: parallel_no_contention
  links:
    - {vm_id: cloud-1, bandwidth_mbps: 80, propagation_ms: 5}
    - {vm_id: cloud-2, bandwidth_mbps: 100, propagation_ms: 4}
    - {vm_id: fog-a1, bandwidth_mbps: 160, propagation_ms: 0.2}
    - {vm_id: fog-a2, bandwidth_mbps: 100, propagation_ms: 0.3}
    - {vm_id: fog-b1, bandwidth_mbps: 120, propagation_ms: 0.5}
    - {vm_id: fog-b2, bandwidth_mbps: 80, propagation_ms: 0.4}
workload:
  generator: uniform_interarrival
  length_unit: bytes
  arrival_time_unit: milliseconds
  task_count: 100
  seed: 42
  interarrival_ms_range: [0, 2]
  length_bytes_range: [500, 3000]
  data_size_kb_range: [20, 150]
  required_resources: {cpu_units: 2, memory_gb: 4}
